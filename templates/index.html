<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Compressor - Compress PDFs to 199MB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        input[type="file"] {
            display: none;
        }

        .target-size-container {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .target-size-container label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .target-size-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .target-size-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .target-size-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .target-size-input span {
            color: #666;
            font-weight: 600;
        }

        .file-info {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .file-size {
            color: #666;
        }

        .compress-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
            display: none;
        }

        .compress-btn.show {
            display: block;
        }

        .compress-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .compress-btn:active {
            transform: translateY(0);
        }

        .compress-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            margin: 20px 0;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }

        .result-container {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .result-title {
            color: #2e7d32;
            font-weight: 600;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #333;
            font-size: 1.5em;
            font-weight: 600;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #1b5e20;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #666;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .spinner.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 PDF Compressor</h1>
        <p class="subtitle">Compress your PDFs without losing quality</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to browse or drag & drop your PDF here</div>
            <div class="upload-hint">Upload any size PDF (Vercel infrastructure limits may apply)</div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="target-size-container">
            <label for="targetSize">Target Size (MB):</label>
            <div class="target-size-input">
                <input type="number" id="targetSize" value="199" min="1" max="500" step="1">
                <span>MB</span>
            </div>
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <button class="compress-btn" id="compressBtn">
            Compress PDF
        </button>

        <div class="spinner" id="spinner"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">
                    <span id="progressPercent">0%</span>
                </div>
            </div>
            <div class="progress-text" id="progressText">Compressing your PDF...</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-title">✅ Compression Complete!</div>
            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-label">Original Size</div>
                    <div class="stat-value" id="originalSize">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Compressed Size</div>
                    <div class="stat-value" id="compressedSize">-</div>
                </div>
                <div class="stat-item" style="grid-column: span 2;">
                    <div class="stat-label">Space Saved</div>
                    <div class="stat-value" id="compressionPercent">-</div>
                </div>
            </div>
            <button class="download-btn" id="downloadBtn">
                ⬇️ Download Compressed PDF
            </button>
            <button class="reset-btn" id="resetBtn">
                Compress Another PDF
            </button>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let compressedFilename = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const compressBtn = document.getElementById('compressBtn');
        const spinner = document.getElementById('spinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.getElementById('progressText');
        const errorMessage = document.getElementById('errorMessage');
        const resultContainer = document.getElementById('resultContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const targetSize = document.getElementById('targetSize');

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            if (file.type !== 'application/pdf') {
                showError('Please select a PDF file');
                return;
            }

            selectedFile = file;
            fileName.textContent = `📄 ${file.name}`;
            fileSize.textContent = `Size: ${formatFileSize(file.size)}`;
            fileInfo.classList.add('show');
            compressBtn.classList.add('show');
            errorMessage.classList.remove('show');
            resultContainer.classList.remove('show');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        compressBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('target_size', targetSize.value);

            compressBtn.disabled = true;
            spinner.classList.add('show');
            progressContainer.classList.add('show');
            errorMessage.classList.remove('show');
            resultContainer.classList.remove('show');

            // Simulate progress
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 90) progress = 90;
                updateProgress(progress);
            }, 500);

            try {
                const response = await fetch('/compress', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                updateProgress(100);

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                compressedFilename = data.filename;

                // Show results
                setTimeout(() => {
                    spinner.classList.remove('show');
                    progressContainer.classList.remove('show');
                    resultContainer.classList.add('show');

                    document.getElementById('originalSize').textContent = data.original_size + ' MB';
                    document.getElementById('compressedSize').textContent = data.compressed_size + ' MB';
                    document.getElementById('compressionPercent').textContent = data.compression_percent + '%';
                }, 500);

            } catch (error) {
                clearInterval(progressInterval);
                spinner.classList.remove('show');
                progressContainer.classList.remove('show');
                showError(error.message);
                compressBtn.disabled = false;
            }
        });

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
            progressPercent.textContent = Math.round(percent) + '%';
        }

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('show');
        }

        downloadBtn.addEventListener('click', () => {
            if (compressedFilename) {
                window.location.href = `/download/${compressedFilename}`;
            }
        });

        resetBtn.addEventListener('click', () => {
            selectedFile = null;
            compressedFilename = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            compressBtn.classList.remove('show');
            compressBtn.disabled = false;
            resultContainer.classList.remove('show');
            errorMessage.classList.remove('show');
            progressContainer.classList.remove('show');
            spinner.classList.remove('show');
            updateProgress(0);
        });
    </script>
</body>
</html>
