<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Rotator - Rotate PDF Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --bg-gradient-3: #f093fb;
            --container-bg: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #999;
            --card-bg: #f8f9ff;
            --card-bg-hover: #f0f2ff;
            --border-color: #ddd;
        }

        body.dark-mode {
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --bg-gradient-3: #0f3460;
            --container-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #808080;
            --card-bg: #2a2a2a;
            --card-bg-hover: #333333;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            animation: gradientShift 15s ease infinite;
            background-size: 200% 200%;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            transition: background 0.3s ease;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .nav-menu {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-link:hover {
            background: var(--card-bg);
            color: #667eea;
        }

        .dark-mode-toggle {
            background: var(--card-bg);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed transparent;
            background: linear-gradient(var(--container-bg), var(--container-bg)) padding-box,
                        linear-gradient(135deg, #667eea, #764ba2, #f093fb) border-box;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .rotation-selector {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .rotation-selector.show {
            display: block;
        }

        .rotation-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .rotation-btn {
            padding: 15px;
            border: 2px solid transparent;
            background: var(--container-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 2em;
        }

        .rotation-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .rotate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: none;
        }

        .rotate-btn.show {
            display: block;
        }

        .result-container {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <div class="nav-menu">
                <a href="/" class="nav-link">🏠 Compress</a>
                <a href="/merge-page" class="nav-link">📑 Merge</a>
                <a href="/smart-merge" class="nav-link">🧠 Smart Merge</a>
                <a href="/split-page" class="nav-link">✂️ Split</a>
                <a href="/rotate-page" class="nav-link">🔄 Rotate</a>
            </div>
            <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle Dark Mode">🌙</button>
        </div>

        <h1>🔄 PDF Rotator</h1>
        <p class="subtitle">Rotate your PDF pages</p>

        <div class="upload-area" id="uploadArea">
            <div style="font-size: 3em; margin-bottom: 15px;">📄</div>
            <div style="font-size: 1.2em; color: var(--text-primary); margin-bottom: 10px;">Upload PDF to Rotate</div>
            <div style="color: var(--text-tertiary); font-size: 0.9em;">Click or drag & drop</div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="rotation-selector" id="rotationSelector">
            <div style="font-weight: 600; margin-bottom: 15px; color: var(--text-primary);">Select Rotation Angle:</div>
            <div class="rotation-options">
                <button class="rotation-btn active" data-rotation="90" title="Rotate 90° clockwise">↻ 90°</button>
                <button class="rotation-btn" data-rotation="180" title="Rotate 180°">↻ 180°</button>
                <button class="rotation-btn" data-rotation="270" title="Rotate 270° clockwise (90° counter-clockwise)">↺ 270°</button>
                <button class="rotation-btn" data-rotation="-90" title="Rotate 90° counter-clockwise">↺ 90°</button>
            </div>
            <div style="color: var(--text-secondary); font-size: 0.9em; margin-top: 10px;">
                <input type="radio" name="pageselect" value="all" id="allPages" checked>
                <label for="allPages">Rotate all pages</label>
                <span style="margin: 0 15px;">|</span>
                <input type="radio" name="pageselect" value="custom" id="customPages">
                <label for="customPages">Custom pages:</label>
                <input type="text" id="pageRange" placeholder="e.g., 1-5, 10" style="margin-left: 10px; padding: 5px; border-radius: 5px; border: 1px solid var(--border-color); background: var(--container-bg); color: var(--text-primary);" disabled>
            </div>
        </div>

        <button class="rotate-btn" id="rotateBtn">🔄 Rotate PDF</button>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-container" id="resultContainer">
            <div style="color: #2e7d32; font-weight: 600; font-size: 1.5em; margin-bottom: 15px; text-align: center;">
                ✅ PDF Rotated Successfully!
            </div>
            <p style="color: #666; margin: 15px 0; text-align: center;" id="rotateInfo">-</p>
            <button class="download-btn" id="downloadBtn">⬇️ Download Rotated PDF</button>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let selectedRotation = 90;
        let rotatedFilename = null;

        // Dark mode
        const darkModeToggle = document.getElementById('darkModeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️';
        }
        darkModeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            darkModeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file || file.type !== 'application/pdf') {
                showError('Please select a PDF file');
                return;
            }

            selectedFile = file;
            document.getElementById('rotationSelector').classList.add('show');
            document.getElementById('rotateBtn').classList.add('show');
        }

        // Rotation selection
        const rotationButtons = document.querySelectorAll('.rotation-btn');
        rotationButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                rotationButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRotation = parseInt(btn.dataset.rotation);
            });
        });

        // Page selection
        document.getElementById('customPages').addEventListener('change', function() {
            document.getElementById('pageRange').disabled = !this.checked;
        });
        document.getElementById('allPages').addEventListener('change', function() {
            document.getElementById('pageRange').disabled = this.checked;
        });

        // Rotate button
        document.getElementById('rotateBtn').addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('rotation', selectedRotation);
            
            const pageSelect = document.querySelector('input[name="pageselect"]:checked').value;
            if (pageSelect === 'custom') {
                formData.append('pages', document.getElementById('pageRange').value);
            } else {
                formData.append('pages', 'all');
            }

            try {
                const response = await fetch('/rotate', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                rotatedFilename = data.filename;
                document.getElementById('rotateInfo').textContent = data.message;
                document.getElementById('resultContainer').classList.add('show');
            } catch (error) {
                showError(error.message);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (rotatedFilename) {
                window.location.href = `/download/${rotatedFilename}`;
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
