<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Splitter - Extract Pages from PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --bg-gradient-3: #f093fb;
            --container-bg: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #999;
            --card-bg: #f8f9ff;
            --card-bg-hover: #f0f2ff;
            --border-color: #ddd;
        }

        body.dark-mode {
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --bg-gradient-3: #0f3460;
            --container-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #808080;
            --card-bg: #2a2a2a;
            --card-bg-hover: #333333;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            animation: gradientShift 15s ease infinite;
            background-size: 200% 200%;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            transition: background 0.3s ease;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .nav-menu {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-link:hover {
            background: var(--card-bg);
            color: #667eea;
        }

        .dark-mode-toggle {
            background: var(--card-bg);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed transparent;
            background: linear-gradient(var(--container-bg), var(--container-bg)) padding-box,
                        linear-gradient(135deg, #667eea, #764ba2, #f093fb) border-box;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        input[type="file"] {
            display: none;
        }

        .page-range-selector {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .page-range-selector.show {
            display: block;
        }

        .range-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .range-btn {
            padding: 12px;
            border: 2px solid transparent;
            background: var(--container-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: var(--text-primary);
        }

        .range-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .custom-range-input {
            display: none;
            margin-top: 15px;
        }

        .custom-range-input.show {
            display: block;
        }

        .custom-range-input input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            background: var(--container-bg);
            color: var(--text-primary);
        }

        .split-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: none;
        }

        .split-btn.show {
            display: block;
        }

        .split-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.5);
        }

        .result-container {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <div class="nav-menu">
                <a href="/" class="nav-link">🏠 Compress</a>
                <a href="/merge-page" class="nav-link">📑 Merge</a>
                <a href="/smart-merge" class="nav-link">🧠 Smart Merge</a>
                <a href="/split-page" class="nav-link">✂️ Split</a>
                <a href="/rotate-page" class="nav-link">🔄 Rotate</a>
            </div>
            <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle Dark Mode">🌙</button>
        </div>

        <h1>✂️ PDF Splitter</h1>
        <p class="subtitle">Extract specific pages from your PDF</p>

        <div class="upload-area" id="uploadArea">
            <div style="font-size: 3em; margin-bottom: 15px;">📄</div>
            <div style="font-size: 1.2em; color: var(--text-primary); margin-bottom: 10px;">Upload PDF to Split</div>
            <div style="color: var(--text-tertiary); font-size: 0.9em;">Click or drag & drop</div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="page-range-selector" id="pageRangeSelector">
            <div style="font-weight: 600; margin-bottom: 15px; color: var(--text-primary);">Select Pages to Extract:</div>
            <div class="range-options">
                <button class="range-btn active" data-mode="all">📄 All Pages</button>
                <button class="range-btn" data-mode="first">1️⃣ First Page</button>
                <button class="range-btn" data-mode="last">⏭️ Last Page</button>
                <button class="range-btn" data-mode="custom">⚙️ Custom Range</button>
            </div>
            <div class="custom-range-input" id="customRangeInput">
                <label style="color: var(--text-secondary); display: block; margin-bottom: 8px;">Enter page range (e.g., 1-5, 10, 15-20):</label>
                <input type="text" id="pageRange" placeholder="e.g., 1-5, 10, 15-20">
                <div style="color: var(--text-tertiary); font-size: 0.85em; margin-top: 8px;">
                    Total pages: <span id="totalPages">-</span>
                </div>
            </div>
        </div>

        <button class="split-btn" id="splitBtn">✂️ Split PDF</button>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-container" id="resultContainer">
            <div style="color: #2e7d32; font-weight: 600; font-size: 1.5em; margin-bottom: 15px; text-align: center;">
                ✅ PDF Split Successfully!
            </div>
            <p style="color: #666; margin: 15px 0; text-align: center;" id="splitInfo">-</p>
            <button class="download-btn" id="downloadBtn">⬇️ Download Split PDF</button>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let totalPages = 0;
        let splitMode = 'all';
        let splitFilename = null;

        // Dark mode
        const darkModeToggle = document.getElementById('darkModeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️';
        }
        darkModeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            darkModeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.transform = 'scale(1.02)';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.transform = 'scale(1)';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.transform = 'scale(1)';
            handleFile(e.dataTransfer.files[0]);
        });

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') {
                showError('Please select a PDF file');
                return;
            }

            selectedFile = file;
            
            // Get page count
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/get-page-count', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.page_count) {
                    totalPages = data.page_count;
                    document.getElementById('totalPages').textContent = totalPages;
                    document.getElementById('pageRangeSelector').classList.add('show');
                    document.getElementById('splitBtn').classList.add('show');
                }
            } catch (error) {
                showError('Failed to read PDF');
            }
        }

        // Range mode selection
        const rangeButtons = document.querySelectorAll('.range-btn');
        const customRangeInput = document.getElementById('customRangeInput');

        rangeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                rangeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                splitMode = btn.dataset.mode;
                
                if (splitMode === 'custom') {
                    customRangeInput.classList.add('show');
                } else {
                    customRangeInput.classList.remove('show');
                }
            });
        });

        // Split button
        document.getElementById('splitBtn').addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('mode', splitMode);
            
            if (splitMode === 'custom') {
                formData.append('range', document.getElementById('pageRange').value);
            }

            try {
                const response = await fetch('/split', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                splitFilename = data.filename;
                document.getElementById('splitInfo').textContent = data.message;
                document.getElementById('resultContainer').classList.add('show');
            } catch (error) {
                showError(error.message);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (splitFilename) {
                window.location.href = `/download/${splitFilename}`;
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
